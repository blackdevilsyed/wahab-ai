<!DOCTYPE html>
<html>

<head>

<title>Wahab AI</title>

<style>

body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}

h1{
  color:#38bdf8;
}

#chat{
  height:400px;
  overflow:auto;
  border:1px solid #334155;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
}

input{
  width:70%;
  padding:10px;
  border:none;
  border-radius:10px;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#38bdf8;
  color:black;
  font-weight:bold;
}

.user{
  color:#facc15;
  margin:10px 0;
}

.ai{
  color:#4ade80;
  margin:10px 0;
}

</style>

</head>

<body>

<h1>Wahab AI Assistant</h1>

<div id="chat"></div>

<input
id="input"
placeholder="Type message..." />

<button onclick="sendMessage()">
Send
</button>

<script>

async function sendMessage(){

const input =
document.getElementById("input");

const chat =
document.getElementById("chat");

const text = input.value;

if(!text) return;

chat.innerHTML +=
`<div class="user">
You: ${text}
</div>`;

input.value = "";

try{

const response =
await fetch("/api/chat", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
message:text
})

});

const data =
await response.json();

chat.innerHTML +=
`<div class="ai">
AI: ${data.reply}
</div>`;

chat.scrollTop =
chat.scrollHeight;

}catch(err){

chat.innerHTML +=
`<div class="ai">
Error connecting AI
</div>`;

}

}

</script>

</body>

</html>
